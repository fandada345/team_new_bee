<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spend Insight AI Demo</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f6f7fb;
        --surface: #ffffff;
        --text: #172033;
        --muted: #657085;
        --border: #dfe4ec;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --success: #15803d;
        --warning: #b45309;
        --danger: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        margin-bottom: 24px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: 0;
      }

      h2 {
        margin-bottom: 16px;
        font-size: 22px;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 17px;
      }

      .subtitle {
        max-width: 720px;
        color: var(--muted);
        font-size: 16px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 12px 28px rgba(23, 32, 51, 0.06);
      }

      .upload-form {
        display: grid;
        gap: 14px;
        margin-bottom: 24px;
      }

      label {
        font-weight: 700;
      }

      input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fbfcff;
      }

      button {
        width: fit-content;
        min-height: 42px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .status {
        min-height: 24px;
        color: var(--muted);
        font-weight: 700;
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: var(--success);
      }

      .results {
        display: grid;
        gap: 20px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        min-height: 104px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        background: #fbfcff;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: 26px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 13px;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .insights {
        display: grid;
        gap: 12px;
      }

      .insight {
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 14px 16px;
        background: #fbfcff;
      }

      .insight p {
        margin-bottom: 8px;
        color: var(--muted);
      }

      .severity {
        display: inline-block;
        color: var(--warning);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 24px, 1080px);
          padding: 20px 0;
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }
      }

      @media (max-width: 480px) {
        .metrics {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Spend Insight AI</h1>
        <p class="subtitle">
          Upload a transaction CSV and view a simple spending summary, category breakdown, and rule-based insights.
        </p>
      </header>

      <section class="panel upload-form" aria-labelledby="upload-title">
        <h2 id="upload-title">Analyze CSV</h2>
        <label for="csv-file">CSV file</label>
        <input id="csv-file" type="file" accept=".csv,text/csv">
        <button id="analyze-button" type="button">Analyze spending</button>
        <div id="status" class="status" role="status"></div>
      </section>

      <section id="results" class="results hidden" aria-live="polite">
        <section class="panel" aria-labelledby="summary-title">
          <h2 id="summary-title">Summary</h2>
          <div id="summary" class="metrics"></div>
        </section>

        <section class="panel" aria-labelledby="category-title">
          <h2 id="category-title">Category Breakdown</h2>
          <table>
            <thead>
              <tr>
                <th>Category</th>
                <th>Total Spend</th>
                <th>Transactions</th>
                <th>Share</th>
              </tr>
            </thead>
            <tbody id="category-breakdown"></tbody>
          </table>
        </section>

        <section class="panel" aria-labelledby="insights-title">
          <h2 id="insights-title">Insights</h2>
          <div id="insights" class="insights"></div>
        </section>
      </section>
    </main>

    <script>
      const apiUrl = "http://127.0.0.1:8000/analyze";
      const fileInput = document.getElementById("csv-file");
      const analyzeButton = document.getElementById("analyze-button");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const summaryEl = document.getElementById("summary");
      const categoryBreakdownEl = document.getElementById("category-breakdown");
      const insightsEl = document.getElementById("insights");

      const currencyFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      });

      function setStatus(message, type = "") {
        statusEl.textContent = message;
        statusEl.className = type ? `status ${type}` : "status";
      }

      function renderMetric(label, value) {
        return `
          <div class="metric">
            <span>${label}</span>
            <strong>${value}</strong>
          </div>
        `;
      }

      function renderResults(data) {
        const summary = data.summary;
        const dateRange = `${summary.date_range.start || "N/A"} to ${summary.date_range.end || "N/A"}`;

        summaryEl.innerHTML = [
          renderMetric("Transactions", summary.total_transactions),
          renderMetric("Total Spend", currencyFormatter.format(summary.total_spending)),
          renderMetric("Average", currencyFormatter.format(summary.average_transaction)),
          renderMetric("Date Range", dateRange)
        ].join("");

        categoryBreakdownEl.innerHTML = data.category_breakdown
          .map((item) => `
            <tr>
              <td>${item.category}</td>
              <td>${currencyFormatter.format(item.total_spending)}</td>
              <td>${item.transaction_count}</td>
              <td>${item.share_percentage}%</td>
            </tr>
          `)
          .join("");

        insightsEl.innerHTML = data.insights
          .map((item) => `
            <article class="insight">
              <h3>${item.title}</h3>
              <p>${item.evidence}</p>
              <p>${item.recommendation}</p>
              <span class="severity">${item.severity}</span>
            </article>
          `)
          .join("");

        resultsEl.classList.remove("hidden");
      }

      async function analyzeCsv() {
        const file = fileInput.files[0];
        if (!file) {
          setStatus("Choose a CSV file first.", "error");
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        analyzeButton.disabled = true;
        setStatus("Analyzing CSV...");

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            body: formData
          });
          const data = await response.json();

          if (!response.ok) {
            const details = data.errors && data.errors.length
              ? ` ${data.errors.join(" ")}`
              : "";
            throw new Error(`${data.detail || "Analysis failed."}${details}`);
          }

          renderResults(data);
          setStatus("Analysis complete.", "success");
        } catch (error) {
          resultsEl.classList.add("hidden");
          setStatus(error.message || "Could not analyze the CSV.", "error");
        } finally {
          analyzeButton.disabled = false;
        }
      }

      analyzeButton.addEventListener("click", analyzeCsv);
    </script>
  </body>
</html>
